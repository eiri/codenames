name: test
on:
  push:
    branches:
      - main
  pull_request:
permissions: {}
jobs:
  test:
    strategy:
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
          cache: "npm"
      - name: Install deps
        run: npm ci --no-audit
      - name: Build package
        run: npm run build
      - name: Run tests
        run: npm run test
      - name: Run type check
        run: npm run typecheck
      - name: Run lint
        run: npm run lint
  automerge:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Automerge dependabot
        uses: fastify/github-action-merge-dependabot@v3
