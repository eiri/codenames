name: test
on:
  push:
    branches:
      - main
  pull_request:
permissions: {}
jobs:
  test:
    strategy:
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup node ${{ matrix.node }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
          cache: "npm"
      - name: Install deps
        run: npm ci --no-audit
      - name: Build package
        run: npm run build
      - name: Run tests
        run: npm run test
      - name: Run type check
        run: npm run typecheck
      - name: Run lint
        run: npm run lint

  lockfile:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  automerge:
    needs: [test, lockfile]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Automerge dependabot
        uses: fastify/github-action-merge-dependabot@v3.15.0
